# Server Port (Render provides PORT environment variable)
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Supabase / Render / Local)
# Values injected via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# HikariCP Connection Pool Settings - Đẩy lên 100
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000

# JSON Formatter
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Gemini AI Voice Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
audio.output.dir=${AUDIO_OUTPUT_DIR:../frontend/public/audio}

# Swagger OpenAPI & Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# TTS Configuration & Provider Switch (azure | gemini)
tts.provider=${TTS_PROVIDER:azure}
tts.cache.dir=${TTS_CACHE_DIR:audio-cache}
tts.fallback.enabled=${TTS_FALLBACK_ENABLED:true}

# Azure Speech Configuration
azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:southeastasia}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,https://viecultures.vercel.app}

