# Server Port (Render provides PORT environment variable)
server.port=${PORT}

# PostgreSQL Database Configuration (Supabase / Render / Local)
# Values injected via environment variables: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JSON Formatter
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Gemini AI Voice Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
audio.output.dir=${AUDIO_OUTPUT_DIR}

