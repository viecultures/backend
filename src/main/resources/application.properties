# Server Port
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

# JPA / Hibernate settings
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW}

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME}

# JSON Formatter
spring.jackson.date-format=${JACKSON_DATE_FORMAT}
spring.jackson.time-zone=${JACKSON_TIME_ZONE}

# Gemini AI Voice Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL}
gemini.api.url=${GEMINI_API_URL}
audio.output.dir=${AUDIO_OUTPUT_DIR:./uploads/audio}

# Gemini AI Chat (Companion) Configuration
gemini.chat.api.key=${GEMINI_CHAT_API_KEY:${GEMINI_API_KEY:}}
gemini.chat.api.url=${GEMINI_CHAT_API_URL:${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}}

# Swagger OpenAPI & Swagger UI Configuration
springdoc.swagger-ui.path=${SWAGGER_UI_PATH}
springdoc.swagger-ui.operations-sorter=${SWAGGER_OPERATIONS_SORTER}
springdoc.swagger-ui.tags-sorter=${SWAGGER_TAGS_SORTER}
springdoc.api-docs.path=${SWAGGER_API_DOCS_PATH}

# TTS Configuration & Provider Switch (azure | gemini)
tts.provider=${TTS_PROVIDER:azure}
tts.cache.dir=${TTS_CACHE_DIR:audio-cache}
tts.fallback.enabled=${TTS_FALLBACK_ENABLED:true}

# Azure Speech Configuration
azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:southeastasia}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}
google.client-id=${GOOGLE_CLIENT_ID}

# Spring Mail (Gmail SMTP)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from.name=${MAIL_FROM_NAME}

# Thymeleaf Template Engine (for HTML emails)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Google Analytics 4 & Google Search Console Integration
google.integration.credentials-path=${GOOGLE_CREDENTIALS_PATH:service-account.json}
google.integration.credentials-json=${GOOGLE_CREDENTIALS_JSON:}
google.integration.ga4-property-id=${GA4_PROPERTY_ID:561849201}
google.integration.gsc-site-url=${GSC_SITE_URL:sc-domain:viecultures.app}


# Cloudflare R2 Storage Configuration
cloudflare.r2.account-id=${R2_ACCOUNT_ID:}
cloudflare.r2.access-key-id=${R2_ACCESS_KEY_ID:}
cloudflare.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:viecultures-assets}
cloudflare.r2.public-domain=${R2_PUBLIC_DOMAIN:https://cdn.viecultures.com}